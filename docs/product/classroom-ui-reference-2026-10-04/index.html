<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>퀴즈타운 · 교실 UI 레퍼런스</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#203d32;font:16px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{max-width:1560px;margin:auto;padding:32px 28px 20px}h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#607168;line-height:1.6}main{max-width:1560px;margin:auto;padding:0 28px 40px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}button,a{font:inherit}button{cursor:pointer;border:1px solid #dae3dc;background:white;color:#345348;border-radius:10px;padding:10px 14px}button[aria-pressed=true]{background:#287c58;color:#fff;border-color:#287c58}.viewer{background:#fff;border:1px solid #dce5df;border-radius:16px;overflow:hidden}.bar{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.bar strong{font-size:20px}.bar a{color:#287c58}.viewer img{display:block;width:100%;height:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}.grid button{padding:0;overflow:hidden;text-align:left}.grid img{width:100%;display:block}.grid span{display:block;padding:12px;font-weight:700}.note{font-size:13px;margin-top:18px}@media(max-width:800px){header{padding:24px 16px 16px}main{padding:0 16px 28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:24px}}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style>
<header><h1>퀴즈타운 · 내 교실 UI 레퍼런스</h1><p>학생에게는 활동과 성장, 교사에게는 학생 관리와 빠른 처리 · 데스크톱 화면 11종</p></header>
<main><nav class="tabs" aria-label="레퍼런스 화면 선택"><button type="button" data-index="0" aria-pressed="true">학생 홈</button><button type="button" data-index="1" aria-pressed="false">교사 홈</button><button type="button" data-index="2" aria-pressed="false">학생카드</button><button type="button" data-index="3" aria-pressed="false">퀘스트</button><button type="button" data-index="4" aria-pressed="false">성장루틴</button><button type="button" data-index="5" aria-pressed="false">젬스톤</button><button type="button" data-index="6" aria-pressed="false">직업</button><button type="button" data-index="7" aria-pressed="false">마켓</button><button type="button" data-index="8" aria-pressed="false">은행</button><button type="button" data-index="9" aria-pressed="false">학급미션</button><button type="button" data-index="10" aria-pressed="false">처리할 일</button></nav>
<section class="viewer"><div class="bar"><strong id="title">학생 홈</strong><a id="download" href="01-student-home.png" download>PNG 원본 저장</a></div><a id="full" href="01-student-home.png" target="_blank" rel="noopener"><img id="hero" src="01-student-home.png" alt="학생 홈 레퍼런스"></a></section>
<p class="note">디자인 방향을 비교하기 위한 AI 생성 시안입니다. 이미지 속 수치·날짜·문구는 샘플이며 확정된 기능 명세가 아닙니다. 전체 원본과 생성·수정 프롬프트를 함께 보관했습니다.</p>
<div class="grid"><button type="button" data-index="0" aria-label="학생 홈 크게 보기"><img src="01-student-home.png" alt="학생 홈" loading="lazy"><span>01 · 학생 홈</span></button><button type="button" data-index="1" aria-label="교사 홈 크게 보기"><img src="02-teacher-home.png" alt="교사 홈" loading="lazy"><span>02 · 교사 홈</span></button><button type="button" data-index="2" aria-label="학생카드 크게 보기"><img src="03-students.png" alt="학생카드" loading="lazy"><span>03 · 학생카드</span></button><button type="button" data-index="3" aria-label="퀘스트 크게 보기"><img src="04-quests.png" alt="퀘스트" loading="lazy"><span>04 · 퀘스트</span></button><button type="button" data-index="4" aria-label="성장루틴 크게 보기"><img src="05-routines.png" alt="성장루틴" loading="lazy"><span>05 · 성장루틴</span></button><button type="button" data-index="5" aria-label="젬스톤 크게 보기"><img src="06-growth.png" alt="젬스톤" loading="lazy"><span>06 · 젬스톤</span></button><button type="button" data-index="6" aria-label="직업 크게 보기"><img src="07-jobs.png" alt="직업" loading="lazy"><span>07 · 직업</span></button><button type="button" data-index="7" aria-label="마켓 크게 보기"><img src="08-market.png" alt="마켓" loading="lazy"><span>08 · 마켓</span></button><button type="button" data-index="8" aria-label="은행 크게 보기"><img src="09-bank.png" alt="은행" loading="lazy"><span>09 · 은행</span></button><button type="button" data-index="9" aria-label="학급미션 크게 보기"><img src="10-mission.png" alt="학급미션" loading="lazy"><span>10 · 학급미션</span></button><button type="button" data-index="10" aria-label="처리할 일 크게 보기"><img src="11-review.png" alt="처리할 일" loading="lazy"><span>11 · 처리할 일</span></button></div></main>
<script>const assets=[{"file":"01-student-home.png","title":"학생 홈"},{"file":"02-teacher-home.png","title":"교사 홈"},{"file":"03-students.png","title":"학생카드"},{"file":"04-quests.png","title":"퀘스트"},{"file":"05-routines.png","title":"성장루틴"},{"file":"06-growth.png","title":"젬스톤"},{"file":"07-jobs.png","title":"직업"},{"file":"08-market.png","title":"마켓"},{"file":"09-bank.png","title":"은행"},{"file":"10-mission.png","title":"학급미션"},{"file":"11-review.png","title":"처리할 일"}];
document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.index),s=assets[i];document.querySelector('#hero').src=s.file;document.querySelector('#hero').alt=s.title+' 레퍼런스';document.querySelector('#title').textContent=s.title;document.querySelector('#full').href=s.file;document.querySelector('#download').href=s.file;document.querySelectorAll('.tabs button').forEach(t=>t.setAttribute('aria-pressed',String(Number(t.dataset.index)===i)));document.querySelector('.tabs').scrollIntoView({behavior:'smooth',block:'start'});});</script></html>
