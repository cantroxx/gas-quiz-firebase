<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>스터디 타운 · 랭킹 연결</title><style>body{font:17px system-ui;background:#142336;color:#edf5ff;max-width:560px;margin:60px auto;padding:24px;line-height:1.7}button,a{display:inline-block;padding:13px 20px;background:#9eedcc;color:#14332a;border:0;border-radius:12px;font:inherit;margin:6px 0}small{display:block;color:#b5c9da}</style></head><body><h1>스터디 타운 랭킹 연결</h1><p id="status" role="status">퀴즈타운 로그인 상태를 확인하고 있어요.</p><a href="/" target="_blank" rel="noopener">퀴즈타운 로그인 열기</a><button id="connect">학생 계정 확인하고 연결</button><small>같은 브라우저에서 퀴즈타운 학생 계정으로 로그인한 뒤 연결 버튼을 누르세요. 비밀번호 대신 이 게임의 랭킹 전용 연결 번호를 사용해요.</small><script src="/__/firebase/10.12.2/firebase-app-compat.js"></script><script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/10.12.2/firebase-firestore-compat.js"></script><script src="/__/firebase/init.js"></script><script src="/__/firebase/10.12.2/firebase-functions-compat.js"></script><script>
(function(){'use strict';const query=new URLSearchParams(location.search),origin=query.get('origin'),nonce=query.get('nonce'),status=document.getElementById('status'),button=document.getElementById('connect');const allowed=['https://dj48-fraction-world.vercel.app','https://dj48-quiztown-firebase.web.app'];if(!allowed.includes(origin)||!nonce||!/^[a-f0-9]{48}$/.test(nonce)||!window.opener){status.textContent='스터디 타운의 랭킹 연결 버튼에서 다시 열어 주세요.';button.disabled=true;return;}
async function check(){button.disabled=true;try{const user=firebase.auth().currentUser;if(!user)throw Error('먼저 퀴즈타운에서 학생 계정으로 로그인해 주세요.');const result=await firebase.app().functions('asia-northeast3').httpsCallable('studyTownAction')({action:'connect'});if(!result.data.eligible)throw Error('학생 계정으로 연결해 주세요.');window.opener.postMessage({type:'study-town-connect',nonce,account:result.data},origin);status.textContent='계정 확인 완료! 스터디 타운 화면으로 돌아가세요.';}catch(e){status.textContent=e.message&&/학생|로그인|비활성/.test(e.message)?e.message:'계정 확인에 실패했어요. 로그인 상태와 인터넷 연결을 확인해 주세요.';}finally{button.disabled=false;}}
button.onclick=check;firebase.auth().onAuthStateChanged(user=>{status.textContent=user?'연결 버튼을 누르면 학생 계정을 확인합니다.':'퀴즈타운 로그인 후 연결 버튼을 눌러 주세요.';});
})();
</script></body></html>
