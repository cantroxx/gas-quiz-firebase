<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 집 레벨 훈장 미리보기</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="home-view" style="width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0;">
    <div id="profile-card-root" class="profile-card-root"></div>
  </main>
  <script src="/js/features/home-data.js"></script>
  <script src="/js/data/level-medal-assets.js"></script>
  <script src="/js/features/home-render.js"></script>
  <script>
    const levelSummary = window.DJ48HomeData.computeHomeLevelSummary(340);
    levelSummary.medalAsset = window.DJ48LevelMedalAssets.getLevelMedalAsset(levelSummary.level);
    window.DJ48HomeRender.renderProfileCard('profile-card-root', {
      avatar: '🙂',
      nickname: '관리자 미리보기',
      school: 'DJ48 4학년 8반 23번',
      titleName: '삼국시대 전문가',
      badgeName: '맞춤법 훈련',
      coinText: '340 DJ코인',
      rankingMessage: '오늘도 도전!',
      role: 'admin',
      adminLevel: 'superadmin',
      levelSummary
    }, {
      levelMedalAssets: window.DJ48LevelMedalAssets.LEVEL_MEDAL_ASSETS,
      getLevelMedalAsset: window.DJ48LevelMedalAssets.getLevelMedalAsset,
      getProfileLevelMedalPreviewLevel: () => 50,
      isAdminProfile: () => true
    });
    document.querySelector('[data-profile-detail-toggle="level-medal"]')?.classList.add('is-active');
    document.querySelector('[data-profile-detail-toggle="level-medal"]')?.setAttribute('aria-expanded', 'true');
    document.querySelector('[data-profile-detail-panel="level-medal"]')?.classList.add('is-active');
  </script>
</body>
</html>
