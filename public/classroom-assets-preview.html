<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교실 에셋 미리보기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #233028;
      --muted: #65746a;
      --line: rgba(47, 125, 68, 0.16);
      --panel: #fffdf6;
      --green: #2f7d44;
      --mint: #e9f7e8;
      --gold: #ffcf5a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3e8;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: grid;
      gap: 8px;
      margin-bottom: 22px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      color: var(--green);
      font-size: 1.8rem;
      line-height: 1.2;
    }

    header p {
      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .asset-card {
      display: grid;
      gap: 12px;
      min-height: 230px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(47, 83, 52, 0.08);
    }

    .asset-art {
      display: grid;
      place-items: center;
      min-height: 116px;
      border: 1px dashed rgba(47, 125, 68, 0.2);
      border-radius: 8px;
      background:
        linear-gradient(45deg, rgba(47, 125, 68, 0.05) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(47, 125, 68, 0.05) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(47, 125, 68, 0.05) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(47, 125, 68, 0.05) 75%),
        #fff;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
    }

    .asset-art img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .asset-meta {
      display: grid;
      gap: 5px;
    }

    .asset-meta strong {
      color: var(--green);
      font-size: 1rem;
    }

    .asset-meta span {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--mint);
      color: var(--green);
      font-size: 0.76rem;
      font-weight: 900;
    }

    .error {
      padding: 14px;
      border: 1px solid rgba(179, 38, 30, 0.22);
      border-radius: 8px;
      background: #fff1ee;
      color: #9b221a;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>교실 이미지 에셋 미리보기</h1>
      <p>운영 화면에 연결하지 않은 샘플 에셋입니다. `asset-manifest.json` 기준으로 파일 경로와 분류를 검수합니다.</p>
    </header>
    <section id="asset-grid" class="asset-grid" aria-label="교실 이미지 에셋"></section>
  </main>

  <script>
    const grid = document.getElementById('asset-grid');

    function renderError(message) {
      grid.innerHTML = '';
      const error = document.createElement('p');
      error.className = 'error';
      error.textContent = message;
      grid.appendChild(error);
    }

    function renderAsset(asset) {
      const card = document.createElement('article');
      const art = document.createElement('div');
      const image = document.createElement('img');
      const meta = document.createElement('div');
      const name = document.createElement('strong');
      const id = document.createElement('span');
      const type = document.createElement('span');
      const path = document.createElement('span');
      const status = document.createElement('span');

      card.className = 'asset-card';
      art.className = 'asset-art';
      meta.className = 'asset-meta';
      image.src = asset.path;
      image.alt = asset.name;
      name.textContent = asset.name;
      id.textContent = asset.assetId;
      type.textContent = `${asset.type} / ${asset.category}`;
      path.textContent = asset.path;
      status.className = 'status';
      status.textContent = asset.status;

      art.appendChild(image);
      meta.append(name, id, type, path, status);
      card.append(art, meta);
      grid.appendChild(card);
    }

    fetch('/images/classroom-assets/asset-manifest.json')
      .then(response => {
        if(!response.ok) throw new Error('manifest-load-failed');
        return response.json();
      })
      .then(manifest => {
        const assets = Array.isArray(manifest.assets) ? manifest.assets : [];
        grid.innerHTML = '';
        assets.forEach(renderAsset);
      })
      .catch(() => {
        renderError('에셋 manifest를 불러오지 못했습니다. 로컬 서버에서 public/classroom-assets-preview.html을 확인해 주세요.');
      });
  </script>
</body>
</html>
