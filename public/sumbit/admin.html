<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>숨빛 · 관리자 인증</title><style>body{font:17px system-ui;background:#f5f0e6;color:#263f34;max-width:540px;margin:50px auto;padding:24px;line-height:1.7}button,a{display:block;padding:14px 20px;border:0;border-radius:12px;margin:14px 0;font:inherit;background:#315944;color:white;text-align:center}small{color:#59675f}button:disabled{opacity:.5}</style></head><body><h1>숨빛 관리자 인증</h1><p id="status" role="status">퀴즈타운 로그인 상태를 확인하고 있어요.</p><a href="/" target="_blank" rel="noopener">퀴즈타운 로그인 열기</a><button id="connect" disabled>9-9-99 계정으로 관리자 연결</button><button id="google" hidden>허용된 구글 계정으로 로그인</button><small>등록된 구글 이메일로 로그인하거나, 같은 브라우저에서 퀴즈타운 9-9-99 계정으로 로그인한 뒤 연결하세요. 숨빛 서버가 로그인과 계정 권한을 확인합니다. 학생의 비밀번호·점수·그림은 변경하지 않습니다.</small><script src="/__/firebase/10.12.2/firebase-app-compat.js"></script><script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script><script src="/__/firebase/init.js"></script><script>
(async()=>{'use strict';const q=new URLSearchParams(location.search),origin=q.get('origin'),challenge=q.get('challenge'),status=document.getElementById('status'),button=document.getElementById('connect'),google=document.getElementById('google');const allowed=['https://sumbit-candy-lvgwneybea-du.a.run.app','https://sumbit-workshop-lvgwneybea-du.a.run.app'];

async function exchange(user){if(!user)throw Error('퀴즈타운 9-9-99 계정으로 먼저 로그인해주세요.');const idToken=await user.getIdToken(true);const response=await fetch(origin+'/admin/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge,idToken})});const result=await response.json();if(!response.ok)throw Error(result.error||'관리자 권한을 확인하지 못했어요.');window.opener.postMessage({type:'sumbit-admin',challenge,...result},origin);status.textContent='인증 완료! 숨빛 화면으로 돌아가세요.';button.disabled=google.disabled=true;}
button.onclick=async()=>{button.disabled=true;try{await exchange(firebase.auth().currentUser);}catch(e){status.textContent=(e.message||'인증에 실패했어요.')+' 숨빛에서 로그인 창을 다시 열어주세요.';button.disabled=false;}};

try{const config=await fetch(origin+'/admin/config').then(r=>r.json());if(config.googleEnabled){google.hidden=false;google.onclick=async()=>{google.disabled=true;try{const app=firebase.apps.find(a=>a.name==='sumbit-google')||firebase.initializeApp({apiKey:'AIzaSyD1KoJQtLBJI8nBi5xZ25jx9WS2Rb9Utro',authDomain:'seoul-heritage-9187f.firebaseapp.com',projectId:'seoul-heritage-9187f',appId:'1:770113870315:web:7a78e30563041cb7d161ae'},'sumbit-google'),auth=app.auth();await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await exchange((await auth.signInWithPopup(provider)).user);await auth.signOut();}catch{status.textContent='구글 인증을 완료하지 못했어요. 숨빛에서 로그인 창을 다시 열어주세요.';google.disabled=false;}};}}catch{}
})();</script></body></html>
