<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레벨 훈장 후보 미리보기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263028;
      --muted: #6a756f;
      --line: rgba(38, 48, 40, 0.14);
      --panel: #fffdf7;
      --surface: #f5f0e7;
      --accent: #2f7d54;
      --blue: #2a6fbb;
      --gold: #e3a72f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      color: var(--accent);
      font-size: 1.55rem;
      line-height: 1.2;
    }

    p {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .summary {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .medal-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .medal-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 18px rgba(54, 72, 50, 0.08);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .level {
      color: var(--blue);
      font-size: 0.88rem;
      font-weight: 950;
    }

    .category {
      min-width: 0;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .art {
      display: grid;
      place-items: center;
      min-height: 112px;
      border: 1px dashed rgba(42, 111, 187, 0.18);
      border-radius: 8px;
      background:
        linear-gradient(45deg, rgba(42, 111, 187, 0.06) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(42, 111, 187, 0.06) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(42, 111, 187, 0.06) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(42, 111, 187, 0.06) 75%),
        #fff;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
    }

    .art img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    .scale-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .scale-row img {
      object-fit: contain;
      flex: 0 0 auto;
    }

    .size-48 {
      width: 48px;
      height: 48px;
    }

    .size-32 {
      width: 32px;
      height: 32px;
    }

    .error {
      padding: 14px;
      border: 1px solid rgba(179, 38, 30, 0.22);
      border-radius: 8px;
      background: #fff1ee;
      color: #9b221a;
      font-weight: 850;
    }

    @media (max-width: 860px) {
      header {
        grid-template-columns: 1fr;
      }

      .summary {
        justify-content: flex-start;
      }

      .medal-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .medal-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .art img {
        width: 84px;
        height: 84px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>레벨 훈장 후보 미리보기</h1>
        <p>Recraft #1 결과물을 원본 수정 없이 5x10으로 crop한 후보입니다. 운영 화면에는 연결하지 않았습니다.</p>
      </div>
      <div class="summary" aria-label="요약">
        <span class="pill" id="count-pill">0개</span>
        <span class="pill">96px / 48px / 32px</span>
      </div>
    </header>
    <section id="medal-grid" class="medal-grid" aria-label="레벨 훈장 후보"></section>
  </main>

  <script>
    const grid = document.getElementById('medal-grid');
    const countPill = document.getElementById('count-pill');

    function renderError(message) {
      grid.innerHTML = '';
      const error = document.createElement('p');
      error.className = 'error';
      error.textContent = message;
      grid.appendChild(error);
    }

    function renderMedal(asset) {
      const card = document.createElement('article');
      const head = document.createElement('div');
      const level = document.createElement('span');
      const category = document.createElement('span');
      const art = document.createElement('div');
      const large = document.createElement('img');
      const scales = document.createElement('div');
      const medium = document.createElement('img');
      const small = document.createElement('img');

      card.className = 'medal-card';
      head.className = 'card-head';
      level.className = 'level';
      category.className = 'category';
      art.className = 'art';
      scales.className = 'scale-row';
      medium.className = 'size-48';
      small.className = 'size-32';

      level.textContent = `Lv.${String(asset.level).padStart(2, '0')}`;
      category.textContent = asset.category;
      large.src = asset.path;
      medium.src = asset.path;
      small.src = asset.path;
      large.alt = asset.name;
      medium.alt = `${asset.name} 48px`;
      small.alt = `${asset.name} 32px`;

      head.append(level, category);
      art.appendChild(large);
      scales.append(medium, small);
      card.append(head, art, scales);
      grid.appendChild(card);
    }

    fetch('/images/classroom-assets/medals/candidates/level-medals-manifest.json')
      .then(response => {
        if (!response.ok) throw new Error('manifest-load-failed');
        return response.json();
      })
      .then(manifest => {
        const assets = Array.isArray(manifest.assets) ? manifest.assets : [];
        countPill.textContent = `${assets.length}개`;
        grid.innerHTML = '';
        assets.forEach(renderMedal);
      })
      .catch(() => {
        renderError('레벨 훈장 manifest를 불러오지 못했습니다. 로컬 서버에서 이 파일을 열어 주세요.');
      });
  </script>
</body>
</html>
